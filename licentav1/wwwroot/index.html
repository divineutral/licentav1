<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Dashboard - Transilvania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 250px;
            --accent: #56723e;
            --accent-light: #e8efe1;
            --accent-dark: #3d5229;
        }

        body {
            background: #f8f9fa;
            font-family: 'Segoe UI',sans-serif;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            background: #212529;
            min-height: 100vh;
            position: fixed;
            z-index: 1000;
        }

            .sidebar .nav-link {
                color: rgba(255,255,255,.7);
                margin: 4px 12px;
                border-radius: 8px;
                transition: .25s;
                font-size: .88rem;
            }

                .sidebar .nav-link.active, .sidebar .nav-link:hover {
                    background: var(--accent);
                    color: #fff;
                    font-weight: 600;
                }

            .sidebar .logo-box {
                padding: 18px;
                background: rgba(255,255,255,.05);
                border-radius: 10px;
                margin: 12px;
            }

        .main-content {
            margin-left: var(--sidebar-w);
            padding: 28px;
        }

        /* Filter bar */
        .filter-bar {
            background: #fff;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            border-top: 5px solid var(--accent);
        }

        /* Accordion */
        .accordion-item {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
        }

        .accordion-button {
            background: #fff;
            font-weight: 600;
            color: #495057;
        }

            .accordion-button:not(.collapsed) {
                background: #f1f3ee;
                color: var(--accent);
                box-shadow: none;
            }

            .accordion-button:focus {
                box-shadow: none;
            }

        /* Select2 */
        .select2-container .select2-selection--single {
            height: 38px !important;
            border: 1px solid #dee2e6 !important;
            display: flex;
            align-items: center;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            top: 6px;
        }

        .select2-container--default .select2-selection--multiple {
            border: 1px solid #dee2e6 !important;
            min-height: 38px;
        }

        /* ============ EXCEL PREVIEW BOX ============ */
        .excel-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: #f1f3ee;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid var(--accent);
            user-select: none;
            flex-wrap: wrap;
        }

            .excel-toolbar .lbl {
                font-size: .75rem;
                color: var(--accent);
                font-weight: 600;
                white-space: nowrap;
            }

            .excel-toolbar input[type=range] {
                width: 100px;
                accent-color: var(--accent);
                cursor: pointer;
            }

            .excel-toolbar .zval {
                font-size: .75rem;
                font-weight: 700;
                color: #495057;
                min-width: 36px;
                text-align: center;
            }

            .excel-toolbar .zbtn {
                background: #fff;
                border: 1px solid #dee2e6;
                border-radius: 4px;
                padding: 1px 7px;
                font-size: .85rem;
                cursor: pointer;
                color: var(--accent);
                font-weight: bold;
                line-height: 1.5;
            }

                .excel-toolbar .zbtn:hover {
                    background: var(--accent-light);
                }

        .excel-preview-box {
            overflow: auto;
            border: 1px solid #c8d4b8;
            border-radius: 0 0 8px 8px;
            background: #fff;
            max-height: 480px;
            position: relative;
        }

            .excel-preview-box::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            .excel-preview-box::-webkit-scrollbar-track {
                background: #f1f3ee;
                border-radius: 5px;
            }

            .excel-preview-box::-webkit-scrollbar-thumb {
                background: var(--accent);
                border-radius: 5px;
                border: 2px solid #f1f3ee;
            }

                .excel-preview-box::-webkit-scrollbar-thumb:hover {
                    background: var(--accent-dark);
                }

            .excel-preview-box::-webkit-scrollbar-corner {
                background: #f1f3ee;
            }

        .excel-preview-box {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #f1f3ee;
        }

        .scale-wrap {
            transform-origin: top left;
            display: inline-block;
            min-width: 100%;
        }

        /* ============ TABLE STYLES ============ */
        .etbl {
            border-collapse: separate;
            border-spacing: 0;
            white-space: nowrap;
            font-size: .79rem;
        }

            .etbl th, .etbl td {
                border: 1px solid #dee2e6;
                padding: 5px 8px;
            }

            .etbl thead th {
                position: sticky;
                top: 0;
                z-index: 10;
                background: var(--accent);
                color: #fff;
                font-weight: bold;
                text-align: center;
            }
            /* Sticky col 1 */
            .etbl th:nth-child(1), .etbl td:nth-child(1) {
                position: sticky;
                left: 0;
                z-index: 9;
                background: var(--accent);
                color: #fff;
                min-width: 42px;
                text-align: center;
            }
            /* Sticky col 2 */
            .etbl th:nth-child(2), .etbl td:nth-child(2) {
                position: sticky;
                left: 42px;
                z-index: 9;
                background: #fff;
                min-width: 200px;
                font-weight: 600;
                border-right: 2px solid #c8d4b8;
            }

            .etbl thead th:nth-child(1), .etbl thead th:nth-child(2) {
                background: var(--accent);
                color: #fff;
                z-index: 12;
            }

            .etbl tbody tr:nth-child(even) td {
                background: #f9fafb;
            }

                .etbl tbody tr:nth-child(even) td:nth-child(2) {
                    background: #f9fafb;
                }

            .etbl tbody tr:hover td {
                background: var(--accent-light) !important;
            }

        .etbl-ans {
            min-width: 2800px;
        }

        .frac-poz {
            background: #d4edda !important;
            color: #155724;
            font-weight: 600;
            text-align: center;
        }

        .prog-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 120px;
        }

        .prog-track {
            flex: 1;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
        }

        .prog-fill {
            height: 6px;
            border-radius: 3px;
        }

        .tr-total td {
            background: #e9ecef !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar d-flex flex-column p-2">
        <div class="logo-box text-center mb-3">
            <img src="images/logo.png" alt="Logo" style="max-width:160px;width:100%;object-fit:contain;"
                 onerror="this.style.display='none';this.parentElement.innerHTML='<h4 class=\'text-white mb-0\'>BI</h4>'">
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="#" class="nav-link active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        </ul>
        <div class="p-2 border-top border-secondary text-center small text-muted mt-auto">Licenta 2026</div>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <h2 class="mb-4 fw-bold text-dark" style="border-left:5px solid var(--accent);padding-left:14px;">
            Academic Year Overview
        </h2>

        <!-- FILTRE -->
        <div class="filter-bar row g-2 align-items-end">
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">An Univ</label>
                <select id="anUnivSelect" class="form-select" style="min-width:140px;"></select>
            </div>
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">Facultate</label>
                <select id="facultateSelect" class="form-select" style="min-width:190px;"></select>
            </div>
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">Departament</label>
                <select id="departamentSelect" class="form-select" style="min-width:190px;"></select>
            </div>
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">Forma Inv.</label>
                <select id="formaInvSelect" class="form-select">
                    <option value="Toti">Toate</option>
                    <option value="Cu frecvență">IF</option>
                    <option value="Frecvență redusă">IFR</option>
                    <option value="Învățământ la distanță">ID</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="small fw-bold text-muted d-block">Specializare</label>
                <select id="specializareSelect" class="form-select w-100" multiple="multiple"></select>
            </div>
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">Semestru</label>
                <select id="semestruSelect" class="form-select">
                    <option value="0">Toate</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="small fw-bold text-muted d-block">Tip Post</label>
                <select id="tipPostSelect" class="form-select">
                    <option value="Toti">Toate</option>
                    <option value="Titular">Titular</option>
                    <option value="Suplinitor">Suplinitor</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="small fw-bold text-muted d-block">Profesor</label>
                <select id="profesorSelect" class="form-select w-100"></select>
            </div>
            <div class="col-auto mt-1">
                <button class="btn btn-secondary btn-sm" onclick="resetView()">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>
        </div>

        <!-- ACCORDION -->
        <div class="accordion" id="acc">

            <!-- R1: Norme -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cNorme">
                        <i class="bi bi-table me-2"></i> Detaliere Norme Profesori
                    </button>
                </h2>
                <div id="cNorme" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-success btn-sm" onclick="dl('norma')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-norme"></div>
                    </div>
                </div>
            </div>

            <!-- R2: Ore Program -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cOre">
                        <i class="bi bi-bar-chart-fill me-2"></i> Distributie Ore Profesor pe Programe
                    </button>
                </h2>
                <div id="cOre" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-success btn-sm" onclick="dl('ore-program')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-ore"></div>
                    </div>
                </div>
            </div>

            <!-- R3: Totaluri Norme -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cTotal">
                        <i class="bi bi-calculator me-2"></i> Totaluri Norme Profesori
                    </button>
                </h2>
                <div id="cTotal" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-success btn-sm" onclick="dl('norma-totaluri')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-total"></div>
                    </div>
                </div>
            </div>

            <!-- R4: Limbi -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cLimbi">
                        <i class="bi bi-translate me-2"></i> Raport Limbi Straine
                    </button>
                </h2>
                <div id="cLimbi" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-success btn-sm" onclick="dl('limbi-straine')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-limbi"></div>
                    </div>
                </div>
            </div>

            <!-- R5: Discipline -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cDisc">
                        <i class="bi bi-book me-2"></i> Raport Discipline Predate
                    </button>
                </h2>
                <div id="cDisc" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-success btn-sm" onclick="dl('discipline-predate')"><i class="bi bi-file-earmark-excel"></i> Export ZIP</button>
                        </div>
                        <div id="box-disc"></div>
                    </div>
                </div>
            </div>

            <!-- R6: Titulari -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cTit">
                        <i class="bi bi-person-check me-2"></i> Raport Cadre Didactice Titulare
                    </button>
                </h2>
                <div id="cTit" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted small"><i class="bi bi-info-circle me-1"></i>Filtru: <code>TitularAnUniv=1</code></span>
                            <button class="btn btn-success btn-sm" onclick="dl('titulari')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-tit"></div>
                    </div>
                </div>
            </div>

            <!-- R7: Colaboratori -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cCol">
                        <i class="bi bi-people me-2"></i> Raport Asociati / Colaboratori
                    </button>
                </h2>
                <div id="cCol" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted small"><i class="bi bi-info-circle me-1"></i>Filtru: <code>TitularAnUniv=0</code></span>
                            <button class="btn btn-success btn-sm" onclick="dl('colaboratori')"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                        </div>
                        <div id="box-col"></div>
                    </div>
                </div>
            </div>

            <!-- R8: ANS -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cANS">
                        <i class="bi bi-file-earmark-spreadsheet me-2"></i> Raport Domenii ANS
                    </button>
                </h2>
                <div id="cANS" class="accordion-collapse collapse" data-bs-parent="#acc">
                    <div class="accordion-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted small"><i class="bi bi-info-circle me-1"></i>50+ coloane dinamice. Scroll orizontal activ.</span>
                            <button class="btn btn-success btn-sm" onclick="dl('raport-ans')"><i class="bi bi-file-earmark-excel"></i> Export Excel ANS</button>
                        </div>
                        <div id="box-ans"></div>
                    </div>
                </div>
            </div>

        </div><!-- /accordion -->
    </div><!-- /main-content -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        // =====================================================================
        // CACHE - evita re-fetch la re-deschidere fara schimbare filtre
        // =====================================================================
        const cache = {};
        function cKey() { return JSON.stringify(getP()); }
        function isDirty(k) { return cache[k] !== cKey(); }
        function markClean(k) { cache[k] = cKey(); }

        // =====================================================================
        // FILTRE
        // =====================================================================
        function getP() {
            const specs = $('#specializareSelect').val();
            return {
                idAnUniv: $('#anUnivSelect').val() || 45,
                facultate: $('#facultateSelect').val() || 'Toti',
                departament: $('#departamentSelect').val() || 'Toti',
                formaInvatamant: $('#formaInvSelect').val() || 'Toti',
                specializari: (specs && specs.length) ? specs.join(',') : 'Toti',
                semestru: $('#semestruSelect').val() || 0,
                tipPost: $('#tipPostSelect').val() || 'Toti',
                profesor: $('#profesorSelect').val() || 'Toti'
            };
        }
        function resetView() { $('.accordion-collapse').collapse('hide'); Object.keys(cache).forEach(k => delete cache[k]); }

        // =====================================================================
        // INIT
        // =====================================================================
        $(document).ready(function () {
            $('#specializareSelect').select2({ placeholder: 'Alege specializari', allowClear: true, width: 'resolve' });
            $('#profesorSelect').select2({ placeholder: 'Cauta profesor...', allowClear: true, width: 'resolve' });

            fetch('/api/Rapoarte/liste/ani-universitari').then(r => r.json()).then(data => {
                const s = document.getElementById('anUnivSelect');
                data.forEach(a => s.innerHTML += `<option value="${a.id}">${a.nume}</option>`);
                if (data.length) s.value = data[0].id;
                $('#facultateSelect').trigger('change');
            });

            fetch('/api/Rapoarte/liste/facultati').then(r => r.json()).then(data => {
                const s = document.getElementById('facultateSelect');
                s.innerHTML = ""; // Curățăm lista existentă
                data.forEach(f => {
                    // Verificăm dacă 'f' este obiect sau string (pentru siguranță)
                    const id = (f && typeof f === 'object') ? (f.id || f.nume) : f;
                    const nume = (f && typeof f === 'object') ? f.nume : f;

                    // Folosim nume pentru afișare și ID/nume pentru valoarea din spate
                    s.innerHTML += `<option value="${id}">${nume}</option>`;
                });
            });

            $('#anUnivSelect').on('change', () => { $('#facultateSelect').trigger('change'); resetView(); });
            $('#departamentSelect, #formaInvSelect, #semestruSelect, #tipPostSelect, #profesorSelect').on('change', resetView);

            $('#facultateSelect').on('change', function () {
                const idAn = $('#anUnivSelect').val();
                const idFac = $(this).val(); // Acesta este ID-ul (ex: 14)

                // Incarca Departamente (folosind ID-ul facultatii pentru filtrare)
                fetch(`/api/Rapoarte/liste/departamente?idAnUniv=${idAn}&numeFacultate=${idFac}`)
                    .then(r => r.json()).then(data => {
                        const $d = $('#departamentSelect').empty();
                        data.forEach(d => $d.append(new Option(d.nume, d.id)));
                        $d.trigger('change');
                    });

                // Incarca Specializari (folosind procedura IL cu ID_Facultate)
                fetch(`/api/Rapoarte/liste/specializari?idFacultate=${idFac}`)
                    .then(r => r.json()).then(data => {
                        const $s = $('#specializareSelect').empty();
                        data.forEach(s => $s.append(new Option(s.nume, s.id)));
                        $s.trigger('change');
                    });
            });
            // La schimbarea specializării, facultății sau departamentului, reîncărcăm lista de profesori
            $('#facultateSelect, #departamentSelect, #specializareSelect').on('change', function () {
                const p = getP();
                resetView(); // Opțional: ascunde tabelele deschise când se schimbă filtrele

                // Folosim noua rută care acceptă ID-uri numerice sau "Toti"
                const url = `/api/Rapoarte/liste/profesori?idAnUniv=${p.idAnUniv}&facultate=${p.facultate}&departament=${p.departament}`;

                fetch(url)
                    .then(r => r.json())
                    .then(data => {
                        const $prof = $('#profesorSelect').empty();
                        // Adăugăm prima opțiune implicită
                        $prof.append(new Option('Toți profesorii', 'Toti'));

                        data.forEach(nume => {
                            if (nume !== 'Toti') {
                                $prof.append(new Option(nume, nume));
                            }
                        });
                        // CRITIC: Anunțăm Select2 că datele s-au schimbat pentru a se randa corect
                        $prof.trigger('change.select2');
                    })
                    .catch(err => console.error("Eroare la incarcarea profesorilor:", err));
            });

            // Accordion listeners
            $('#cNorme').on('show.bs.collapse', () => { if (isDirty('norme')) { loadNorme(); markClean('norme'); } });
            $('#cOre').on('show.bs.collapse', () => { if (isDirty('ore')) { loadOre(); markClean('ore'); } });
            $('#cTotal').on('show.bs.collapse', () => { if (isDirty('total')) { loadTotal(); markClean('total'); } });
            $('#cLimbi').on('show.bs.collapse', () => { if (isDirty('limbi')) { loadLimbi(); markClean('limbi'); } });
            $('#cDisc').on('show.bs.collapse', () => { if (isDirty('disc')) { loadDisc(); markClean('disc'); } });
            $('#cTit').on('show.bs.collapse', () => { if (isDirty('tit')) { loadTit(); markClean('tit'); } });
            $('#cCol').on('show.bs.collapse', () => { if (isDirty('col')) { loadCol(); markClean('col'); } });
            $('#cANS').on('shown.bs.collapse', () => { if (isDirty('ans')) { loadANS(); markClean('ans'); } });
        });

        // =====================================================================
        // EXCEL PREVIEW BOX - builder generic
        // =====================================================================
        let zoomState = {};
        function buildBox(containerId, tableId, extraClass = '') {
            const sid = 'sl-' + containerId, vid = 'zv-' + containerId, wid = 'sw-' + containerId;
            document.getElementById(containerId).innerHTML = `
        <div class="excel-toolbar">
            <span class="lbl"><i class="bi bi-zoom-in me-1"></i>Zoom:</span>
            <button class="zbtn" onclick="adjZ('${sid}','${wid}','${vid}',-10)">−</button>
            <input type="range" id="${sid}" min="30" max="150" value="100" step="5"
                   oninput="applyZ('${sid}','${wid}','${vid}')">
            <button class="zbtn" onclick="adjZ('${sid}','${wid}','${vid}',10)">+</button>
            <span class="zval" id="${vid}">100%</span>
            <button class="zbtn" onclick="resetZ('${sid}','${wid}','${vid}')">Reset</button>
        </div>
        <div class="excel-preview-box">
            <div class="scale-wrap" id="${wid}">
                <table class="etbl table-bordered mb-0 ${extraClass}" id="${tableId}">
                    <thead id="${tableId}-head"><tr><th colspan="10" class="text-center py-3">
                        <div class="spinner-border spinner-border-sm text-light"></div>
                    </th></tr></thead>
                    <tbody id="${tableId}-body"></tbody>
                </table>
            </div>
        </div>`;
            zoomState[sid] = 100;
        }
        function applyZ(sid, wid, vid) {
            const v = parseInt(document.getElementById(sid).value);
            zoomState[sid] = v;
            const w = document.getElementById(wid);
            w.style.transform = `scale(${v / 100})`;
            w.style.width = (10000 / v) + '%';
            document.getElementById(vid).textContent = v + '%';
        }
        function adjZ(sid, wid, vid, delta) {
            const s = document.getElementById(sid);
            s.value = Math.min(150, Math.max(30, parseInt(s.value) + delta));
            applyZ(sid, wid, vid);
        }
        function resetZ(sid, wid, vid) {
            document.getElementById(sid).value = 100; applyZ(sid, wid, vid);
        }

        // =====================================================================
        // HELPERS
        // =====================================================================
        function badge(t) {
            if (!t) return '<span class="badge bg-secondary">-</span>';
            if (t.toLowerCase().includes('tit')) return `<span class="badge" style="background:var(--accent);">${t}</span>`;
            return `<span class="badge bg-warning text-dark">${t}</span>`;
        }
        function progBar(p) {
            const cc = p > 50 ? 'var(--accent)' : p < 10 ? '#ffc107' : '#0dcaf0';
            return `<div class="prog-wrap"><span class="small" style="min-width:34px">${p}%</span>
            <div class="prog-track"><div class="prog-fill" style="width:${Math.min(p, 100)}%;background:${cc};"></div></div></div>`;
        }

        // =====================================================================

            <th>Materie</th><th>Tip Post</th><th>Sem.</th>
            <th>Ore Curs</th><th>Ore Aplic.</th><th>Ore Conv.</th></tr>`;
            const p = getP();
            const params = new URLSearchParams({
                idAnUniv: p.idAnUniv, facultate: p.facultate,

                semestru: p.semestru, tipPost: p.tipPost
            });
            const data = await fetch(`/api/norma?${params}`).then(r => r.json()).catch(() => []);
            const tb = document.getElementById('tNorme-body');
            if (!data.length) { tb.innerHTML = '<tr><td colspan="10" class="text-center">Nu exista date.</td></tr>'; return; }
            let html = '', tc = 0, ta = 0, tv = 0;
            data.forEach(n => {
                const c = +n.nrOreCurs || 0, a = +n.nrOreAplicatii || 0, v = +n.nrOreConventionale || 0;
                tc += c; ta += a; tv += v;
                html += `<tr>
                <td>${n.nrCrt}</td><td>${n.profesor || ''}</td><td>${n.departament || ''}</td>
                <td>${n.specializare || ''}</td><td>${n.materie || ''}</td>
                <td>${badge(n.tipPost)}</td><td class="text-center">${n.semestru || ''}</td>
                <td class="text-center">${c}</td><td class="text-center">${a}</td>
                <td class="text-center fw-bold">${v}</td></tr>`;

            html += `<tr class="tr-total"><td colspan="7" class="text-end">TOTAL:</td>
            <td class="text-center">${tc.toFixed(2)}</td>
            <td class="text-center">${ta.toFixed(2)}</td>
            <td class="text-center text-success">${tv.toFixed(2)}</td></tr>`;
            tb.innerHTML = html;

        // =====================================================================
        // R8: ANS - coloane dinamice
        // =====================================================================
        async function loadANS() {
            buildBox('box-ans', 'tANS', 'etbl-ans');
            const p = getP();
            const params = new URLSearchParams({ idAnUniv: p.idAnUniv, facultate: p.facultate, departament: p.departament });
            const data = await fetch(`/api/ansreport/date?${params}`).then(r => r.json()).catch(() => []);
            const tb = document.getElementById('tANS-body');
            const th = document.getElementById('tANS-head');
            if (!data.length) { tb.innerHTML = '<tr><td colspan="10" class="text-center">Nu exista date.</td></tr>'; return; }

            // Coloane dinamice din ID-urile ANS prezente in date
            const idAnsSet = new Set();
            data.forEach(prof => { if (prof.fractiuniPerDomeniu) Object.keys(prof.fractiuniPerDomeniu).forEach(k => idAnsSet.add(parseInt(k))); });
            const ids = Array.from(idAnsSet).sort((a, b) => a - b);

            th.innerHTML = '<tr><th>Nr.</th><th>Profesor</th><th>Facultate</th><th>Departament</th><th>Grad</th><th>Norma(h)</th><th>Total Ore</th>'
                + ids.map(id => `<th title="ID_ANS=${id}">D.${id}</th>`).join('') + '<th>Σ Frac.</th></tr>';

            tb.innerHTML = '';
            data.forEach((prof, idx) => {
                let tf = 0;
                let cells = `<td>${idx + 1}</td><td>${prof.numeIntreg || ''}</td>
                <td>${prof.facultate || '-'}</td><td>${prof.departament || '-'}</td>
                <td>${prof.grad || '-'}</td>
                <td class="text-center">${prof.normaLegalaOre || ''}</td>
                <td class="text-center">${(+prof.totalOreConv || 0).toFixed(2)}</td>`;
                ids.forEach(id => {
                    const frac = prof.fractiuniPerDomeniu ? (+prof.fractiuniPerDomeniu[id] || 0) : 0;
                    if (frac > 0) { cells += `<td class="frac-poz">${frac.toFixed(2)}</td>`; tf += frac; }
                    else cells += '<td></td>';
                });
                cells += `<td class="fw-bold text-center">${tf.toFixed(2)}</td>`;
                const tr = document.createElement('tr'); tr.innerHTML = cells; tb.appendChild(tr);
            });
        }

        // =====================================================================
        // DOWNLOAD ROUTER
        // =====================================================================
        function dl(tip) {
            const p = getP();
            const id = p.idAnUniv;
            const fac = encodeURIComponent(p.facultate);
            const dept = encodeURIComponent(p.departament);
            const prof = encodeURIComponent(p.profesor);
            const params = new URLSearchParams({
                idAnUniv: id, facultate: p.facultate,
                departament: p.departament, profesor: p.profesor, formaInvatamant: p.formaInvatamant,
                semestru: p.semestru, tipPost: p.tipPost
            });

            if (tip === 'raport-ans') location.href = `/api/ansreport/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}`;
            else if (tip === 'limbi-straine') location.href = `/api/foreignlang/export?idAnUniv=${id}`;
            else if (tip === 'titulari') location.href = `/api/titulari/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}`;
            else if (tip === 'colaboratori') location.href = `/api/colaboratori/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}`;
            else if (tip === 'discipline-predate') location.href = `/api/discipline/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}`;
            else if (tip === 'norma') location.href = `/api/norma/export?${params}`;
            else if (tip === 'ore-program') location.href = `/api/oreprogram/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}&profesor=${prof}`;
            else if (tip === 'norma-totaluri') location.href = `/api/normatotaluri/export?idAnUniv=${id}&facultate=${fac}&departament=${dept}&profesor=${prof}`;
        }
    </script>
